# Install-time half of the INNOGRIT IG5236 APST workaround.
#
# IG5236 drives (HP SSD FX900 Pro and rebadges) drop off the PCIe bus a few
# seconds after going idle; on a root-filesystem drive that takes the filesystem
# read-only, and SMART never warns. Baking the karg into the disk image protects
# a freshly dd'd system from its very first boot — the runtime unit
# (server4home-nvme-apst.service) cannot act until the machine has already booted
# at least once on the affected drive.
#
# Harmless on hosts without an IG5236: it only disables NVMe autonomous power
# state transitions, costing a little idle power on a machine that is always on
# anyway. Drop this block if the boot drive is not IG5236-based and you want
# APST back — the runtime unit still covers the case if such a drive appears.
[customizations.kernel]
append = "nvme_core.default_ps_max_latency_us=0"

# ---------------------------------------------------------------------------
# LVM disk layout
#
# Replaces the previous simple [[customizations.filesystem]] entry — the simple
# and advanced (customizations.disk) forms are alternatives, not additive.
#
# Why LVM: the boot NVMe is moving from 931 GB to 4 TB and will carry root,
# /var (containers, appdata, Postgres) and the ZFS pool keyfile. Sizes for
# appdata are not knowable up front, so being able to reallocate later without
# repartitioning is worth the small extra layer. Nothing needs adding to the
# image for this: lvm2, device-mapper, the dracut 70lvm module and
# coreos-populate-lvmdevices.service are already present, and LVM is already
# in the initramfs (verified with lsinitrd).
#
# /boot and /boot/efi are NOT listed here on purpose — bootc-image-builder
# creates them automatically as plain partitions when root is on an LV, which
# is required since the bootloader cannot read LVM.
#
# bootc-image-builder supports exactly ONE volume group, so everything lives in
# vg4base. This is a new layout, not a reproduction of an old one: as of
# 2026-07-29 z170asrock has NO LVM — a single 20 GiB xfs partition carries
# /sysroot, /var and /etc, with ~911 GB of the 931 GB drive unallocated because
# the previous dd install was never grown.
#
# Splitting /var out of root is the one structural change, and it is worth it on
# an unattended server: if container images, logs or Postgres fill a shared
# filesystem, you cannot stage an ostree upgrade or cleanly log in to fix it.
# A separate /var confines that blast radius to /var. FCOS supports a separate
# /var as a first-class configuration.
#
# Sizes are MINIMUMS, kept deliberately small so disk.raw stays quick to build
# and to stream over HTTP during the swap (the current image is ~22 GB; this is
# ~26 GB). The volume group is grown into the 4 TB free space after install —
# and note LVM lets you leave VG space UNALLOCATED and hand it out later, which
# is the whole reason for doing this.
# ---------------------------------------------------------------------------

# IMPORTANT, learned by building this twice:
#
# `minsize` here is REQUIRED (omitting it fails the build with "minsize is
# required"), and bib does NOT treat it as "size of the whole VG". Measured
# behaviour: the ROOT lv is given this value — its own minsize below is ignored
# — every other LV gets its own minsize, and the VG ends up as the sum.
#
#   VG minsize 26 GiB + root 16 GiB + var 10 GiB  ->  root=26G var=10G VG=36G
#   VG minsize 16 GiB + root 16 GiB + var 10 GiB  ->  root=16G var=10G VG=26G
#
# So set this to the size you want ROOT to be. Getting it wrong is not merely a
# bigger disk.raw: XFS cannot shrink, so an oversized root LV is space that can
# never be handed back to var.
[[customizations.disk.partitions]]
type = "lvm"
name = "vg4base"
minsize = "16 GiB"

# Root: ostree deployments only, once /var is split out. The whole system
# currently uses 6.1 GiB including /var, so 16 GiB holds several deployments
# plus rollback headroom comfortably.
[[customizations.disk.partitions.logical_volumes]]
name = "root"
mountpoint = "/"
label = "root"
fs_type = "xfs"
minsize = "16 GiB"

# /var: containers, quadlet state, appdata, Postgres, and the ZFS pool keyfile.
# Small at install time on purpose — this is the LV to extend into the 4 TB.
[[customizations.disk.partitions.logical_volumes]]
name = "var"
mountpoint = "/var"
label = "var"
fs_type = "xfs"
minsize = "10 GiB"

