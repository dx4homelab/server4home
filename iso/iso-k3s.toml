# K3s installer ISO configuration.
#
# Creates a bootable ISO that installs the base image, then rebases the running
# root to the K3s flavor on first boot (see %post below). Build with:
# just build-iso-k3s
#
# The installer guides the user through disk partitioning interactively. NOTE:
# uCore has no LVM in its initramfs, so if you install to bare metal here, pick
# "Standard Partition" (NOT the LVM default) or the installed node won't boot.
# For a non-LVM, non-K3s storage install use iso-plain.toml instead.

[customizations.installer.kickstart]
contents = """
%post
# After installation, switch to the K3s flavor published by CI. The Anaconda
# installer wrote the *base* image to disk; this rebases the running root to
# the K3s image so the node is K8s-ready on first boot.
bootc switch --mutate-in-place --transport registry ghcr.io/dx4homelab/server4home-k3s:stable
%end
"""

[customizations.installer.modules]
# Enable standard Anaconda installer modules for a guided installation experience
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",    # Disk partitioning and formatting
  "org.fedoraproject.Anaconda.Modules.Runtime",    # Basic runtime configuration  
  "org.fedoraproject.Anaconda.Modules.Network",    # Network configuration
  "org.fedoraproject.Anaconda.Modules.Security",   # Security settings
  "org.fedoraproject.Anaconda.Modules.Services",   # System services
  "org.fedoraproject.Anaconda.Modules.Users",      # User account creation
  "org.fedoraproject.Anaconda.Modules.Timezone"    # Timezone selection
]

# Disable subscription management (not needed for community images)
disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
